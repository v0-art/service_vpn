<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUFFY Control Tower</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Адаптация под цвета темы Telegram */
        body {
            background-color: var(--tg-theme-bg-color, #f3f4f6);
            color: var(--tg-theme-text-color, #111827);
        }
        .tg-button {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
    </style>
</head>
<body class="p-4 font-sans">

    <h1 class="text-2xl font-bold mb-4 border-b pb-2">🏴‍☠️ LUFFY Cluster</h1>
    <div id="access-warning" class="mb-4 hidden p-3 rounded border border-red-300 bg-red-50 text-red-700 text-sm"></div>

    <!-- Секция: Список нод -->
    <div class="mb-6">
        <h2 class="text-xl font-semibold mb-2">Инвентарь серверов</h2>
        <div id="nodes-list" class="space-y-2">
            <p class="text-sm text-gray-500">Загрузка...</p>
        </div>
    </div>

    <!-- Секция: Добавление ноды -->
    <div class="mb-6 bg-white p-4 rounded-lg shadow border border-gray-200">
        <h2 class="text-xl font-semibold mb-3 text-gray-800">Добавить сервер</h2>

        <div class="grid gap-3 md:grid-cols-3 mb-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">IP</label>
                <input type="text" id="node-ip" placeholder="203.0.113.10"
                    class="w-full p-2 border rounded text-gray-900 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Роль</label>
                <select id="node-role" class="w-full p-2 border rounded text-gray-900 focus:ring-blue-500 focus:border-blue-500">
                    <option value="ingress">ingress</option>
                    <option value="egress">egress</option>
                    <option value="master">master</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Дата оплаты</label>
                <input type="date" id="node-billing-date"
                    class="w-full p-2 border rounded text-gray-900 focus:ring-blue-500 focus:border-blue-500">
            </div>
        </div>

        <label class="block text-sm font-medium text-gray-700 mb-1">Приватный SSH ключ (опционально)</label>
        <textarea id="node-ssh-key" rows="4" placeholder="Если оставить пустым — ключ будет сгенерирован автоматически"
            class="w-full p-2 border rounded mb-3 font-mono text-sm text-gray-900 focus:ring-blue-500 focus:border-blue-500"></textarea>

        <button onclick="addNode()" class="tg-button w-full py-2 rounded font-semibold shadow-sm transition-opacity hover:opacity-90">
            ➕ Добавить сервер
        </button>

        <div id="add-node-result" class="mt-3 text-sm hidden p-2 rounded"></div>
    </div>

    <!-- Секция: Управление HAProxy -->
    <div class="mb-6 bg-white p-4 rounded-lg shadow border border-gray-200">
        <h2 class="text-xl font-semibold mb-2 text-gray-800">HAProxy Config Editor</h2>
        
        <label class="block text-sm font-medium text-gray-700 mb-1">IP Ноды (Ingress/Master)</label>
        <input type="text" id="haproxy-ip" placeholder="192.168.1.10" 
               class="w-full p-2 border rounded mb-3 text-gray-900 focus:ring-blue-500 focus:border-blue-500">
        
        <label class="block text-sm font-medium text-gray-700 mb-1">Новый haproxy.cfg</label>
        <textarea id="haproxy-config" rows="6" placeholder="global\n    log /dev/log local0..." 
                  class="w-full p-2 border rounded mb-3 font-mono text-sm text-gray-900 focus:ring-blue-500 focus:border-blue-500"></textarea>
        
        <button onclick="deployHAProxy()" class="tg-button w-full py-2 rounded font-semibold shadow-sm transition-opacity hover:opacity-90">
            🚀 Проверить и Задеплоить
        </button>
        
        <div id="deploy-result" class="mt-3 text-sm hidden p-2 rounded"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
        }

        function setWarning(text) {
            const warning = document.getElementById('access-warning');
            warning.classList.remove('hidden');
            warning.innerText = text;
        }

        function getTelegramInitData() {
            return tg?.initData || '';
        }

        function telegramAlert(message) {
            if (tg?.showAlert) {
                tg.showAlert(message);
            } else {
                alert(message);
            }
        }

        async function apiFetch(url, options = {}) {
            const initData = getTelegramInitData();
            if (!initData) {
                throw new Error('Mini App должен быть открыт из Telegram-бота.');
            }

            const headers = options.headers ? { ...options.headers } : {};
            headers['X-Telegram-Init-Data'] = initData;

            if (options.body && !headers['Content-Type']) {
                headers['Content-Type'] = 'application/json';
            }

            return fetch(url, { ...options, headers });
        }

        // Загрузка списка нод
        async function loadNodes() {
            try {
                const response = await apiFetch('/api/nodes');
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.detail || `HTTP ${response.status}`);
                }
                const nodes = await response.json();
                const container = document.getElementById('nodes-list');
                
                if (nodes.length === 0) {
                    container.innerHTML = '<p class="text-sm text-gray-500">Нет добавленных серверов.</p>';
                    return;
                }

                container.innerHTML = nodes.map(node => `
                    <div class="p-3 bg-white rounded shadow-sm border border-gray-200 flex justify-between items-center">
                        <div>
                            <div class="font-bold text-gray-800">${node.ip}</div>
                            <div class="text-xs text-gray-500">Роль: ${node.role} | Оплата: ${node.billing_date}</div>
                        </div>
                        <div class="text-xs px-2 py-1 rounded ${node.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${node.status}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('nodes-list').innerHTML = `<p class="text-sm text-red-500">Ошибка загрузки данных: ${error.message}</p>`;
                setWarning('Доступ к API разрешен только из Telegram Mini App для ADMIN_ID.');
            }
        }

        async function addNode() {
            const ip = document.getElementById('node-ip').value.trim();
            const role = document.getElementById('node-role').value.trim();
            const billingDate = document.getElementById('node-billing-date').value.trim();
            const sshKey = document.getElementById('node-ssh-key').value.trim();
            const resultDiv = document.getElementById('add-node-result');

            if (!ip || !role || !billingDate) {
                telegramAlert('Заполните IP, роль и дату оплаты.');
                return;
            }

            const payload = {
                ip: ip,
                role: role,
                billing_date: billingDate,
            };
            if (sshKey) {
                payload.ssh_key = sshKey;
            }

            resultDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            resultDiv.classList.add('bg-blue-100', 'text-blue-800');
            resultDiv.innerText = '⏳ Добавляю ноду...';

            try {
                const response = await apiFetch('/api/nodes', {
                    method: 'POST',
                    body: JSON.stringify(payload),
                });
                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    resultDiv.classList.replace('bg-blue-100', 'bg-green-100');
                    resultDiv.classList.replace('text-blue-800', 'text-green-800');
                    resultDiv.innerText = `✅ ${data.message || 'Нода добавлена.'}`;
                    document.getElementById('node-ip').value = '';
                    document.getElementById('node-ssh-key').value = '';
                    await loadNodes();
                    tg?.HapticFeedback?.notificationOccurred('success');
                } else {
                    resultDiv.classList.replace('bg-blue-100', 'bg-red-100');
                    resultDiv.classList.replace('text-blue-800', 'text-red-800');
                    resultDiv.innerText = `❌ Ошибка: ${data.detail || 'не удалось добавить ноду.'}`;
                    tg?.HapticFeedback?.notificationOccurred('error');
                }
            } catch (error) {
                resultDiv.classList.replace('bg-blue-100', 'bg-red-100');
                resultDiv.classList.replace('text-blue-800', 'text-red-800');
                resultDiv.innerText = `❌ Сетевая ошибка: ${error.message}`;
            }
        }

        // Деплой HAProxy
        async function deployHAProxy() {
            const ip = document.getElementById('haproxy-ip').value;
            const configContent = document.getElementById('haproxy-config').value;
            const resultDiv = document.getElementById('deploy-result');

            if (!ip || !configContent) {
                telegramAlert("Заполните IP и конфигурацию!");
                return;
            }

            resultDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            resultDiv.classList.add('bg-blue-100', 'text-blue-800');
            resultDiv.innerText = "⏳ Выполняется деплой и проверка синтаксиса...";

            try {
                const response = await apiFetch('/api/haproxy/apply', {
                    method: 'POST',
                    body: JSON.stringify({ ip: ip, config_content: configContent })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    resultDiv.classList.replace('bg-blue-100', 'bg-green-100');
                    resultDiv.classList.replace('text-blue-800', 'text-green-800');
                    resultDiv.innerText = "✅ " + data.message;
                    tg?.HapticFeedback?.notificationOccurred('success');
                } else {
                    resultDiv.classList.replace('bg-blue-100', 'bg-red-100');
                    resultDiv.classList.replace('text-blue-800', 'text-red-800');
                    resultDiv.innerText = "❌ Ошибка:\n" + (data.detail || 'неизвестная ошибка');
                    tg?.HapticFeedback?.notificationOccurred('error');
                }
            } catch (error) {
                resultDiv.classList.replace('bg-blue-100', 'bg-red-100');
                resultDiv.classList.replace('text-blue-800', 'text-red-800');
                resultDiv.innerText = "❌ Сетевая ошибка при обращении к API: " + error.message;
            }
        }

        // Запуск при загрузке
        if (!getTelegramInitData()) {
            setWarning('Панель нужно открывать через кнопку в Telegram-боте. Прямой вход из браузера ограничен.');
        }
        loadNodes();
    </script>
</body>
</html>
