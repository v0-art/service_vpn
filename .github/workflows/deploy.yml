name: Deploy Control Tower

on:
  push:
    branches:
      - main  # Воркфлоу запускается при пуше изменений в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}          # IP-адрес вашего VPS
          username: ${{ secrets.SSH_USERNAME }}  # Имя пользователя (например, root)
          key: ${{ secrets.SSH_KEY }}            # Приватный SSH-ключ для авторизации на VPS
          port: ${{ secrets.SSH_PORT }}          # Порт SSH (например, 2222)
          script: |
            # Переходим в рабочую папку на сервере (замените путь на свой, если он отличается)
            cd /root/service_vpn
            
            # Подтягиваем последние изменения
            git pull origin main
            
            # Пересобираем и запускаем контейнеры в Docker
            docker compose down
            docker compose up --build -d

            # Базовая проверка backend после деплоя
            WEB_PORT="$(grep -m1 '^WEB_PORT=' .env | cut -d= -f2)"
            WEB_PORT="${WEB_PORT:-8080}"
            docker compose ps
            curl --fail --show-error --silent "http://127.0.0.1:${WEB_PORT}/health" >/dev/null || (docker compose logs --tail=120 control-tower && exit 1)
            
            # Удаляем неиспользуемые промежуточные docker-образы для очистки диска
            docker image prune -f
